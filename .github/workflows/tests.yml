name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 2.7.1 是 manifest 声明的下限；2.21.0 是 1.3 时代的最后一版；
        # 2.22.1 是 MaiBot 1.4.3 随附的 SDK，1.4 兼容改动按它验证。
        sdk: ["2.7.1", "2.21.0", "2.22.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt "maibot-plugin-sdk==${{ matrix.sdk }}"
      - name: Run test suite
        run: python -m pytest -q
