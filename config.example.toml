# 绝地潜兵 2：民主帮你选择 —— 配置示例
# 在 MaiBot WebUI 的插件配置或 config.toml 中维护以下设置。

[plugin]

# MaiBot Runner 要求的配置结构版本，请保留。
config_version = "1.0.0"

# 全局群白名单，通过 WebUI 或配置文件添加或移除群。
# 所有命令（含 help/status/diag）均须先通过此检查；默认空名单拒绝全部命令。
# 未列出的群和没有群号的私聊均不可用；宿主操作员及管理员不能绕过。
# 例：allowed_groups = ["123456789", "987654321"]
allowed_groups = []

# 管理员账号白名单。在允许群内，仅宿主操作员和这些账号可以执行 /hd diag 和 /hd exp on|off|status。
# 实验配装默认关闭，通过上述命令管理当前群的实验白名单。
# 配装、状态和帮助允许群成员可用，可用功能命令黑名单限制，不需要订阅。
# 宿主操作员与白名单管理员可绕过功能命令黑名单，但不可绕过群白名单。
# 例：admin_users = ["123456789", "987654321"]
admin_users = []

# 功能命令黑名单。每条规则填写一个 QQ 号和命令 loadout / exp / status / help / "*"。
# loadout 限制普通和实验配装的抽取与重抽，exp 还可单独限制实验预设列表和抽取。
# "*" 禁止该账号使用全部功能命令。diag 和实验白名单管理使用管理员权限判断。
command_blacklist = []

# 普通与实验配装抽取后可单格重抽的有效秒数，允许范围 10–3600。
# 每次成功重抽刷新有效期；超时后需重新抽取整套配装。
loadout_reroll_seconds = 120

# 手动填写黑名单时，删除上面的 command_blacklist = []，再按以下格式增加规则。
# [[plugin.command_blacklist]]
# action = "*"
# user_id = "10001"
#
# [[plugin.command_blacklist]]
# action = "loadout"
# user_id = "10002"
